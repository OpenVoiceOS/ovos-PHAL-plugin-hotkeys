[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-hotkeys"
dynamic = ["version"]
description = "map keypresses to OVOS bus events"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["OVOS", "plugin"]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-plugin-manager>=0.0.1"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-hotkeys"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-hotkeys" = "ovos_phal_plugin_hotkeys:HotKeysPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_phal_plugin_hotkeys.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_phal_plugin_hotkeys*"]

[tool.setuptools.package-data]
ovos_phal_plugin_hotkeys = ["*.json"]
